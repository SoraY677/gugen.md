services:
    root:
      image: node:22
      working_dir: /app
      volumes:
        - ./:/app
      tty: true

    library:
      image: node:22
      working_dir: /library
      depends_on: 
        - root
      tty: true
      volumes:
        - ./library:/library
        - ./tsconfig.json:/tsconfig.json:ro
        - ./demo/library:/library/dist
      command: >
        bash -cc "yarn && yarn dev"
      ports:
        - 5173:5173
      environment:
        - CHOKIDAR_USEPOLLING=true

    demo:
      image: node:22
      working_dir: /demo
      depends_on: 
        - library
      tty: true
      volumes:
        - ./demo:/demo
        - ./tsconfig.json:/tsconfig.json:ro
      command: >
        bash -cc "yarn && yarn dev"
      environment:
        - CHOKIDAR_USEPOLLING=true
